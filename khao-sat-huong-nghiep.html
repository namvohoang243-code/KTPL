<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La bàn nghề nghiệp – Test tính cách định hướng nghề</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#120e2b; --bg2:#1b1442; --ink:#efecff; --muted:#a9a3d1; --line:rgba(255,255,255,.12);
  --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.12);
  --violet:#9b8cff; --sky:#7aa8ff; --mint:#7ee0c3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#120e2b; --bg2:#1b1442; } /* trang thiết kế dark mode cố định */
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;color:var(--ink);background:var(--bg);
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;
  background-image:
    radial-gradient(60rem 40rem at 10% -10%, rgba(155,140,255,.35), transparent 60%),
    radial-gradient(50rem 36rem at 100% 10%, rgba(122,168,255,.28), transparent 60%),
    radial-gradient(40rem 30rem at 50% 110%, rgba(126,224,195,.16), transparent 60%);
  background-attachment:fixed;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mint);outline-offset:3px;border-radius:10px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 20px 64px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;letter-spacing:.2px}
.brand svg{width:28px;height:28px}
nav.tabs{display:flex;gap:6px;padding:5px;border-radius:999px}
nav.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.92rem}
nav.tabs button[aria-current="page"]{background:linear-gradient(135deg,var(--violet),var(--sky));color:#13102b}
h1{font-size:clamp(2.2rem,6.2vw,4.1rem);line-height:1.08;margin:0 0 16px;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;margin:0 0 12px;font-weight:800}
h3{font-size:1.02rem;margin:0 0 8px;font-weight:600}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;padding:14px 26px;border-radius:14px;font-weight:600;background:linear-gradient(135deg,var(--violet),var(--sky));color:#13102b;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn.ghost{background:var(--glass2);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.55;cursor:default;transform:none}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center;padding:20px 0}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.form{padding:26px}
label{display:block;font-size:.88rem;color:var(--muted);margin:0 0 6px}
input[type=text]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(10,7,30,.55);margin-bottom:16px}
input::placeholder{color:#7d77a8}
.type-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:.85rem}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.quiz{max-width:720px;margin:10px auto 0}
.progress{height:8px;border-radius:99px;background:var(--glass2);overflow:hidden;margin:8px 0 22px}
.progress>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--mint));transition:width .4s ease}
.qcard{padding:28px}
.qcard.in{animation:slideIn .35s ease both}
.qcard.out{animation:slideOut .22s ease both}
@keyframes slideIn{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(-34px)}}
.qtext{font-size:1.35rem;font-weight:600;line-height:1.35;margin:6px 0 20px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.05);transition:background .15s,border-color .15s,transform .15s}
.opt:hover{background:var(--glass2);border-color:var(--violet);transform:translateX(3px)}
.opt.sel{background:rgba(155,140,255,.28);border-color:var(--violet)}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.linkbtn{background:none;border:0;color:var(--muted);cursor:pointer;padding:8px 4px}
.linkbtn:hover{color:var(--ink)}
.result-head{padding:30px;margin-bottom:18px;position:relative;overflow:hidden}
.result-head .badge{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;background:var(--glass2);font-size:.85rem;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.card{padding:24px}
.chartbox{position:relative;height:300px}
ul.clean{margin:0;padding-left:18px}
ul.clean li{margin-bottom:6px}
.careers{display:grid;gap:12px}
.career{padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.career b{display:block;font-size:1.02rem;margin-bottom:2px}
.skills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.skills span{font-size:.78rem;padding:3px 10px;border-radius:99px;background:rgba(122,168,255,.18)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
@media(max-width:700px){.stats{grid-template-columns:1fr}}
.stat{padding:20px}
.stat .n{font-size:2rem;font-weight:800;line-height:1.1}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:.93rem}
th{color:var(--muted);font-weight:500}
.tag{display:inline-flex;align-items:center;gap:6px}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#13102b;padding:12px 20px;border-radius:14px;font-weight:600;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.sample{font-size:.72rem;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.12);color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#9b8cff" stroke-width="2"/><path d="M16 5l4 11-4 11-4-11z" fill="#7ee0c3"/><circle cx="16" cy="16" r="2" fill="#120e2b"/></svg>
      La bàn nghề nghiệp
    </div>
    <nav class="tabs glass" aria-label="Điều hướng">
      <button id="tab-test" data-go="home">Làm bài test</button>
      <button id="tab-class" data-go="dashboard">Thống kê lớp</button>

  </header>
  <main id="app"></main>
</div>
<script>
/* ---------- DỮ LIỆU ---------- */
const TYPES = {
  R:{name:"Thực tế", title:"The Builder", color:"#7ee0c3",

       ["Kỹ sư xây dựng","Thiết kế, giám sát công trình nhà ở và hạ tầng.",["Tính toán kết cấu","Quản lý công trường","An toàn lao động"]],
       ["Kỹ thuật viên điện – điện tử","Lắp đặt, bảo trì thiết bị và hệ thống điện.",["Đọc sơ đồ mạch","Chẩn đoán lỗi","Cẩn thận"]],
       ["Nông nghiệp công nghệ cao","Ứng dụng cảm biến, IoT vào trồng trọt, chăn nuôi.",["Sinh học cơ bản","IoT","Quan sát thực địa"]],
       ["Phi công / Kỹ thuật bay","Điều khiển và bảo dưỡng phương tiện bay.",["Phản xạ nhanh","Kỷ luật","Tiếng Anh chuyên ngành"]]]},
  I:{name:"Phân tích", title:"The Thinker", color:"#7aa8ff",

  S:{name:"Kết nối", title:"The Connector", color:"#ff9ec7",

  E:{name:"Lãnh đạo", title:"The Leader", color:"#ffc27a",

/* ---------- VIEW: DASHBOARD ---------- */
let remote=null, remoteState="idle";
function parseCSV(t){const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=""}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}if(f!==""||row.length){row.push(f);rows.push(row)}return rows}
async function loadRemote(){
  if(!STATS_ONLINE||remoteState==="loading"||remoteState==="ok") return;
  remoteState="loading";
  try{
    const u=CONFIG.SHEET_CSV_URL+(CONFIG.SHEET_CSV_URL.includes("?")?"&":"?")+"t="+Date.now();
    const res=await fetch(u); if(!res.ok) throw new Error("http");
    const rows=parseCSV(await res.text()).slice(1);
    /* Thứ tự cột: Dấu thời gian, Tên, Lớp, Nhóm chính, Mã Holland, R, I, A, S, E, C, Nghề */
    remote=rows.map((r,i)=>{const sc={};KEYS.forEach((k,j)=>sc[k]=parseInt(r[5+j])||0);
      return {id:"r"+i,name:(r[1]||"").trim()||"Ẩn danh",cls:(r[2]||"").trim(),scores:sc};})
      .filter(x=>KEYS.reduce((a,k)=>a+x.scores[k],0)>0);
    remoteState="ok";
  }catch(e){ remoteState="fail"; }
  if(S.view==="dashboard"){ killCharts(); render(); }
}
function allStudents(){ return STATS_ONLINE ? (remote||[]) : (ONLINE ? [] : SEED.concat(loadSaved())); }

/* ---------- GỬI VỀ GOOGLE FORM ---------- */
async function doSend(){
  const r=ranked(S.scores), E=CONFIG.ENTRIES, top=TYPES[r[0]];
  const body=new URLSearchParams();
  const put=(k,v)=>{ if(E[k]) body.append(E[k],v); };
  put("name",S.name); put("cls",S.cls); put("group",top.name+" – "+top.title); put("code",r.slice(0,3).join(""));
  KEYS.forEach(k=>put(k,String(S.scores[k]))); put("career",top.careers[0][0]);
  S.send="sending"; updateSend();
  try{
    await fetch(CONFIG.FORM_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body});
    S.send="ok";
  }catch(e){ S.send="fail"; }
  updateSend();
}
function sendText(){
  return S.send==="ok" ? "Đã gửi kết quả cho giáo viên. Bạn có thể đóng trang này."
       : S.send==="fail" ? "Chưa gửi được kết quả. Kiểm tra mạng rồi bấm Gửi lại."
       : "Đang gửi kết quả cho giáo viên…";
}
function updateSend(){
  const el=$("#sendstat"); if(el) el.textContent=sendText();
  const b=$("#resend"); if(b) b.hidden = S.send!=="fail";
}

    <p class="muted" role="status">${note}</p>
    <div class="stats">
      <div class="glass stat"><div class="muted">Đã làm bài</div><div class="n">${list.length} <span class="muted" style="font-size:1rem;font-weight:400">/ ${CLASS_SIZE} bạn</span></div>
        <div class="progress" style="margin:10px 0 0"><i style="width:${Math.min(100,Math.round(list.length/CLASS_SIZE*100))}%"></i></div></div>
      <div class="glass stat"><div class="muted">Nhóm nổi trội nhất lớp</div>${empty?'<div class="n">Chưa có</div><div class="muted">Chờ bạn đầu tiên làm bài</div>':`<div class="n" style="color:${TYPES[dom].color}">${TYPES[dom].name}</div><div class="muted">${cnt[dom]} bạn · ${TYPES[dom].title}</div>`}</div>
      ${STATS_ONLINE
        ? `<div class="glass stat"><div class="muted">Còn chưa làm bài</div><div class="n">${Math.max(0,CLASS_SIZE-list.length)}</div><div class="muted">trên tổng ${CLASS_SIZE} bạn</div></div>`
        : `<div class="glass stat"><div class="muted">Kết quả thật đã lưu</div><div class="n">${real}</div><div class="muted">${real?'Từ trình duyệt này':'Chưa có, hãy làm bài test'}</div></div>`}
    </div>
    <div class="grid2" style="margin-bottom:18px">
      <div class="glass card"><h2>Phân bố nhóm tính cách</h2><div class="chartbox"><canvas id="bar" role="img" aria-label="Biểu đồ cột số bạn theo từng nhóm tính cách"></canvas></div></div>
      <div class="glass card"><h2>Nghề được gợi ý nhiều nhất</h2><div class="chartbox"><canvas id="pie" role="img" aria-label="Biểu đồ tròn các nghề gợi ý nhiều nhất"></canvas></div></div>
    </div>
    <div class="glass card">
      <h2>Kết quả từng bạn</h2>
      <div class="tablewrap"><table>
        <thead><tr><th>Tên</th><th>Lớp</th><th>Nhóm tính cách</th><th>Nghề gợi ý chính</th></tr></thead>
        <tbody>${list.map((s,ix)=>{const r=ranked(s.scores);return `<tr><td>${CONFIG.SHOW_NAMES?esc(s.name):"Bạn "+(ix+1)} ${s.seed?'<span class="sample">mẫu</span>':''}</td><td>${esc(s.cls)}</td><td>${tag(r[0])}</td><td>${TYPES[r[0]].careers[0][0]}</td></tr>`}).join("")}</tbody>
      </table></div>
      <div class="actions">
        <button class="btn" id="take">Làm bài test</button>
        ${STATS_ONLINE?'<button class="btn ghost" id="reload">Tải lại số liệu</button>':(real?'<button class="btn ghost" id="clear">Xóa kết quả đã lưu</button>':'')}
      </div>
    </div>
  </section>`;
}
function bindDashboard(){
  if(STATS_ONLINE && remoteState==="idle") loadRemote();
  const rl=$("#reload"); if(rl) rl.addEventListener("click",()=>{ remoteState="idle"; killCharts(); render(); });
  const list=allStudents();
  const cnt={R:0,I:0,A:0,S:0,E:0,C:0}; const car={};
  list.forEach(s=>{ cnt[ranked(s.scores)[0]]++; topCareers(s.scores).forEach(c=>car[c]=(car[c]||0)+1); });
  charts.push(new Chart($("#bar"),{type:"bar",
    data:{labels:KEYS.map(k=>TYPES[k].name),datasets:[{label:"Số bạn",data:KEYS.map(k=>cnt[k]),backgroundColor:KEYS.map(k=>TYPES[k].color),borderRadius:8}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0,stepSize:1}},x:{grid:{display:false}}}}}));
  const top=Object.entries(car).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const pal=["#9b8cff","#7aa8ff","#7ee0c3","#ff9ec7","#ffc27a","#c58bff"];
  charts.push(new Chart($("#pie"),{type:"doughnut",
    data:{labels:top.map(t=>t[0]),datasets:[{data:top.map(t=>t[1]),backgroundColor:pal,borderColor:"#1b1442",borderWidth:3}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"55%",plugins:{legend:{position:"bottom",labels:{boxWidth:12,padding:10,font:{size:11}}}}}}));
  $("#take").addEventListener("click",()=>go("home"));
  const c=$("#clear"); if(c) c.addEventListener("click",()=>{ if(confirm("Xóa toàn bộ kết quả đã lưu trên trình duyệt này?")){ persist([]); go("dashboard"); } });
}

/* ---------- RENDER ---------- */
function render(){
  const tc=$("#tab-class"); if(tc) tc.hidden = ONLINE && !STATS_ONLINE;
  const nv=document.querySelector("nav.tabs"); if(nv) nv.hidden = ONLINE && !STATS_ONLINE;
  const app=$("#app");
  const v=S.view;
  app.innerHTML = v==="home"?viewHome(): v==="quiz"?viewQuiz(): v==="result"?viewResult(): viewDashboard();
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    const active=(b.dataset.go==="dashboard")===(v==="dashboard");
    if(active) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  if(v==="home") bindHome(); else if(v==="quiz") bindQuiz(); else if(v==="result") bindResult(); else bindDashboard();
}
setChartDefaults();
render();
</script>
</body>
</html>
